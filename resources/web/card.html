<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    background: #1b1e2a;
    color: #e8eaf2;
    font: 12px "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: 8px 12px 10px;
    box-sizing: border-box;
    gap: 7px;
  }
  #preview {
    min-height: 58px;
    display: flex;
    align-items: center;
    overflow: auto;
    padding: 2px 2px 0;
  }
  #preview .katex { font-size: 1.22em; color: #f4f6fb; }
  label {
    display: block;
    margin-bottom: 3px;
    color: #8b93a7;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  input, textarea {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #31374a;
    background: #12141c;
    color: #f2f4fa;
    border-radius: 8px;
    padding: 7px 8px;
    font: 13px "Cascadia Code", Consolas, monospace;
    outline: none;
  }
  textarea { resize: none; height: 62px; }
  input:focus, textarea:focus { border-color: #5b8cff; }
  #err { color: #ff8b9a; min-height: 14px; font-size: 11px; }
</style>
</head>
<body>
  <div id="preview"></div>
  <div>
    <label>Name</label>
    <input id="name" spellcheck="false" autocomplete="off" value="f(x)">
  </div>
  <div>
    <label>Body</label>
    <textarea id="body" spellcheck="false">\sin\left(x\right)</textarea>
  </div>
  <div id="err"></div>
  <script>
    const nameEl = document.getElementById("name");
    const bodyEl = document.getElementById("body");
    const preview = document.getElementById("preview");
    const errEl = document.getElementById("err");
    let applying = false;
    let bridge = null;
    let timer = 0;

    function render() {
      const tex = nameEl.value.trim() + " = " + bodyEl.value.trim();
      try {
        katex.render(tex, preview, { throwOnError: false, displayMode: true, strict: "ignore" });
      } catch (e) {
        preview.textContent = tex;
      }
    }

    function push() {
      if (applying || !bridge) return;
      bridge.update(nameEl.value, bodyEl.value);
    }

    function schedule() {
      render();
      clearTimeout(timer);
      timer = setTimeout(push, 70);
    }

    function setFields(name, body) {
      applying = true;
      nameEl.value = name;
      bodyEl.value = body;
      render();
      applying = false;
    }

    nameEl.addEventListener("input", schedule);
    bodyEl.addEventListener("input", schedule);
    render();

    function connect() {
      if (typeof QWebChannel === "undefined" || typeof qt === "undefined") {
        setTimeout(connect, 30);
        return;
      }
      new QWebChannel(qt.webChannelTransport, function (channel) {
        bridge = channel.objects.bridge;
        bridge.formulaChanged.connect(setFields);
        bridge.errorChanged.connect(function (message) { errEl.textContent = message || ""; });
        bridge.ready();
      });
    }
    connect();
  </script>
</body>
</html>
