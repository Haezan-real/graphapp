<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<style>
  :root {
    --paper: #f4e7c4;
    --ink: #2a241c;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font: 14px "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: 2px 10px 10px;
    box-sizing: border-box;
    gap: 4px;
  }
  #preview {
    min-height: 52px;
    display: flex;
    align-items: center;
    overflow: auto;
  }
  #preview .katex { font-size: 1.35em; color: var(--ink); }
  #source {
    flex: 1;
    width: 100%;
    box-sizing: border-box;
    border: none;
    background: transparent;
    color: var(--ink);
    caret-color: var(--ink);
    padding: 0;
    font: 15px "Cascadia Code", Consolas, monospace;
    line-height: 1.45;
    outline: none;
    resize: none;
  }
  #err {
    color: #8d2e2e;
    min-height: 14px;
    font-size: 11px;
  }
</style>
</head>
<body>
  <div id="preview"></div>
  <textarea id="source" spellcheck="false"></textarea>
  <div id="err"></div>
  <script>
    const sourceEl = document.getElementById("source");
    const preview = document.getElementById("preview");
    const errEl = document.getElementById("err");
    let applying = false;
    let bridge = null;
    let timer = 0;

    function render() {
      const tex = sourceEl.value;
      try {
        katex.render(tex, preview, { throwOnError: false, displayMode: true, strict: "ignore" });
      } catch (e) {
        preview.textContent = tex;
      }
    }

    function push() {
      if (applying || !bridge) return;
      bridge.update(sourceEl.value);
    }

    function schedule() {
      render();
      clearTimeout(timer);
      timer = setTimeout(push, 60);
    }

    function setSource(source) {
      applying = true;
      sourceEl.value = source;
      render();
      applying = false;
    }

    sourceEl.addEventListener("input", schedule);
    render();

    function connect() {
      if (typeof QWebChannel === "undefined" || typeof qt === "undefined") {
        setTimeout(connect, 30);
        return;
      }
      new QWebChannel(qt.webChannelTransport, function (channel) {
        bridge = channel.objects.bridge;
        bridge.formulaChanged.connect(setSource);
        bridge.errorChanged.connect(function (message) { errEl.textContent = message || ""; });
        bridge.ready();
      });
    }
    connect();
  </script>
</body>
</html>
